[package]
name = "micro-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line client for deploying WebAssembly functions to micro.do"
repository = "https://github.com/AndreBaltazar8/micro-cli"
rust-version = "1.90"

[[bin]]
name = "micro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
open = "5.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde"] }
