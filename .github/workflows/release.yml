name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  ABLAC_COMMIT: 217d7801d22adbcd381e1aeba4c0942108f21935
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build public Abla compiler revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/AndreBaltazar8/ablac "$RUNNER_TEMP/ablac"
          git -C "$RUNNER_TEMP/ablac" checkout "$ABLAC_COMMIT"
          nix-shell "$RUNNER_TEMP/ablac/shell.nix" --run "make -C '$RUNNER_TEMP/ablac'"
      - name: Test and compile CLI
        run: >-
          nix-shell "$RUNNER_TEMP/ablac/shell.nix" --run
          "'$RUNNER_TEMP/ablac/build/ablac' package update --project . &&
          make test build ABLAC_DIR='$RUNNER_TEMP/ablac' COMPILER='$RUNNER_TEMP/ablac/build/ablac'"
      - name: Link portable Linux executable
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld libssl-dev
          clang -fuse-ld=lld build/micro.o -lssl -lcrypto -lpthread -o build/micro-linux-x86_64
          strip build/micro-linux-x86_64
          test "$(build/micro-linux-x86_64 --version)" = "micro ${RELEASE_TAG#v}"
          cd build
          sha256sum micro-linux-x86_64 > micro-linux-x86_64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: micro-linux-x86_64
          path: |
            build/micro-linux-x86_64
            build/micro-linux-x86_64.sha256
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install the native Abla toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm@21 lld@21 openssl@3
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@21)/bin" >> "$GITHUB_PATH"
      - name: Build public Abla compiler revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/AndreBaltazar8/ablac "$RUNNER_TEMP/ablac"
          git -C "$RUNNER_TEMP/ablac" checkout "$ABLAC_COMMIT"
          make -C "$RUNNER_TEMP/ablac"
      - name: Test and compile native CLI
        run: |
          "$RUNNER_TEMP/ablac/build/ablac" package update --project .
          make test build ABLAC_DIR="$RUNNER_TEMP/ablac" COMPILER="$RUNNER_TEMP/ablac/build/ablac"
          test "$(build/micro --version)" = "micro ${RELEASE_TAG#v}"
          test "$(uname -m)" = "${{ matrix.architecture }}"
          otool -L build/micro | grep -F '/opt/openssl@3/lib/libssl.3.dylib'
          mv build/micro "build/micro-macos-${{ matrix.architecture }}"
          cd build
          shasum -a 256 "micro-macos-${{ matrix.architecture }}" > "micro-macos-${{ matrix.architecture }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: micro-macos-${{ matrix.architecture }}
          path: |
            build/micro-macos-${{ matrix.architecture }}
            build/micro-macos-${{ matrix.architecture }}.sha256
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify release payload
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          cd dist
          sha256sum --check micro-linux-x86_64.sha256
          sha256sum --check micro-macos-arm64.sha256
          sha256sum --check micro-macos-x86_64.sha256
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/micro-linux-x86_64
          dist/micro-linux-x86_64.sha256
          dist/micro-macos-arm64
          dist/micro-macos-arm64.sha256
          dist/micro-macos-x86_64
          dist/micro-macos-x86_64.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "micro ${RELEASE_TAG#v}"
          --generate-notes
